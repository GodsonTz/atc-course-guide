<!DOCTYPE html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#0a3d2e;--green-mid:#1D9E75;--green-light:#E1F5EE;--green-accent:#5DCAA5;--surface:#f8faf9;--card:#ffffff;--text:#0d1f1a;--text-muted:#5a7a70;--border:rgba(10,61,46,0.1);--radius:14px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);min-height:100vh}
.app-header{background:var(--green);position:sticky;top:0;z-index:100}
.header-inner{padding:1rem 1.25rem 0.75rem}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.app-icon{width:40px;height:40px;background:var(--green-accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:var(--green);flex-shrink:0}
.header-titles{flex:1}
.app-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:#fff}
.app-subtitle{font-size:11px;color:var(--green-accent);margin-top:1px}
.lang-btn{display:flex;align-items:center;background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.2);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang-opt{padding:5px 10px;font-size:11px;font-weight:600;color:rgba(255,255,255,0.5);cursor:pointer;font-family:'DM Sans',sans-serif;border:none;background:transparent}
.lang-opt.active{background:var(--green-accent);color:var(--green)}
.search-wrap{background:rgba(255,255,255,0.08);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px;border:0.5px solid rgba(255,255,255,0.12)}
.search-wrap svg{width:16px;height:16px;fill:var(--green-accent);flex-shrink:0}
.search-wrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;padding:11px 0}
.search-wrap input::placeholder{color:rgba(255,255,255,0.4)}
.filters-scroll{display:flex;gap:8px;padding:0.75rem 1.25rem;overflow-x:auto;scrollbar-width:none;background:var(--green)}
.filters-scroll::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 14px;border-radius:99px;border:0.5px solid rgba(255,255,255,0.2);font-size:12px;font-weight:500;color:rgba(255,255,255,0.6);white-space:nowrap;cursor:pointer;font-family:'DM Sans',sans-serif;background:transparent}
.filter-chip.active{background:var(--green-accent);border-color:var(--green-accent);color:var(--green);font-weight:600}
.stats-bar{padding:0.75rem 1.25rem;font-size:12px;color:var(--text-muted);border-bottom:0.5px solid var(--border)}
.stats-bar span{font-weight:600;color:var(--green-mid)}
.course-list{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:12px;padding-bottom:5rem}
.course-card{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);overflow:hidden;transition:border-color 0.2s}
.course-card.open{border-color:var(--green-mid);box-shadow:0 0 0 3px rgba(29,158,117,0.08)}
.card-summary{padding:1rem 1.25rem;cursor:pointer;display:flex;align-items:flex-start;gap:12px}
.dept-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:2px}
.card-text{flex:1;min-width:0}
.dept-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px;margin-bottom:5px}
.level-badge{display:inline-block;font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;margin-left:4px;background:#f0f4f3;color:var(--text-muted)}
.course-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3}
.course-meta{display:flex;gap:10px;font-size:11px;color:var(--text-muted)}
.chevron-wrap{padding-top:10px}
.chevron{width:20px;height:20px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;transition:transform 0.25s,background 0.2s}
.open .chevron{transform:rotate(180deg);background:var(--green-mid)}
.chevron svg{width:10px;height:10px}
.chevron svg path{stroke:var(--green-mid)}
.open .chevron svg path{stroke:#fff}
.card-tabs{display:none;border-top:0.5px solid var(--border)}
.open .card-tabs{display:flex}
.tab-btn{flex:1;padding:10px;font-size:12px;font-weight:500;color:var(--text-muted);border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;border-bottom:2px solid transparent}
.tab-btn.active{color:var(--green-mid);border-bottom-color:var(--green-mid)}
.card-panel{display:none}
.card-panel.active{display:block}
.semester-block{padding:1rem 1.25rem;border-bottom:0.5px solid var(--border)}
.semester-block:last-child{border-bottom:none}
.semester-label{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--green-mid);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.semester-label::after{content:'';flex:1;height:0.5px;background:var(--border)}
.subject-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:0.5px solid var(--border)}
.subject-row:last-child{border-bottom:none}
.subject-num{font-size:10px;color:var(--text-muted);width:16px;text-align:right;flex-shrink:0}
.subject-dot{width:6px;height:6px;border-radius:50%;background:var(--green-accent);flex-shrink:0}
.subject-name{font-size:13px;color:var(--text);flex:1;line-height:1.3}
.subject-code{font-size:10px;color:var(--text-muted);white-space:nowrap}
.coming-soon-box{margin:1rem 1.25rem;background:#FFF8E1;border:0.5px solid #F9A825;border-radius:var(--radius-sm);padding:14px;text-align:center}
.coming-soon-box p{font-size:12px;color:#7B6000;line-height:1.5;margin-top:4px}
.entry-section{margin:0 1.25rem 1rem;background:var(--green-light);border-radius:var(--radius-sm);padding:12px 14px}
.entry-title{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--green-mid);margin-bottom:5px}
.entry-text{font-size:12px;color:var(--text);line-height:1.6}
.careers-panel{padding:1rem 1.25rem}
.career-section{margin-bottom:1rem}
.career-section:last-child{margin-bottom:0}
.career-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--green-mid);margin-bottom:10px}
.career-item{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);background:var(--surface);margin-bottom:6px}
.career-item:last-child{margin-bottom:0}
.career-emoji{font-size:14px;flex-shrink:0;margin-top:1px}
.career-info{flex:1}
.career-role{font-size:13px;font-weight:500;color:var(--text)}
.career-desc{font-size:11px;color:var(--text-muted);margin-top:2px;line-height:1.4}
.salary-badge{display:inline-block;font-size:10px;font-weight:600;color:var(--green-mid);background:var(--green-light);padding:2px 8px;border-radius:99px;margin-top:4px}
.dept-Automotive{background:#FFF3E0;color:#E65100}
.dept-Civil{background:var(--green-light);color:var(--green-mid)}
.dept-Transport{background:#EDE7F6;color:#512DA8}
.dept-Electrical{background:#FFF8E1;color:#F57F17}
.dept-Mechanical{background:#FCE4EC;color:#880E4F}
.dept-ICT{background:#E3F2FD;color:#0D47A1}
.dept-Science{background:#F3E5F5;color:#6A1B9A}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:0.5px solid var(--border);padding:10px 1.25rem;padding-bottom:env(safe-area-inset-bottom,10px);display:flex;align-items:center;justify-content:space-between;z-index:100}
.bottom-label{font-size:11px;color:var(--text-muted)}
.bottom-label strong{color:var(--green-mid)}
.empty-state{text-align:center;padding:4rem 2rem;color:var(--text-muted);display:none}
.empty-state .icon{font-size:36px;margin-bottom:1rem}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="app-icon">ATC</div>
      <div class="header-titles">
        <div class="app-title" id="appTitle">ATC Course Guide</div>
        <div class="app-subtitle">Arusha Technical College</div>
      </div>
      <div class="lang-btn">
        <button class="lang-opt active" id="btnEN" onclick="setLang('en')">EN</button>
        <button class="lang-opt" id="btnSW" onclick="setLang('sw')">SW</button>
      </div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="Search courses..." oninput="filterCourses()" autocomplete="off"/>
    </div>
  </div>
  <div class="filters-scroll" id="filterRow"></div>
</header>
<div class="stats-bar" id="statsBar"></div>
<main class="course-list" id="courseList"></main>
<div class="empty-state" id="emptyState"><div class="icon">🔍</div><p id="emptyText">No courses found.</p></div>
<div class="bottom-bar">
  <div class="bottom-label">© 2026 <strong>HDG. Tech</strong></div>
  <div class="bottom-label" style="font-size:10px;color:var(--green-mid)">ATC Course Guide</div>
</div>
<script src="courses.js"></script>
<script>
let activeFilter='All';
let openCards={};

function setLang(lang){
  currentLang=lang;
  document.getElementById('btnEN').classList.toggle('active',lang==='en');
  document.getElementById('btnSW').classList.toggle('active',lang==='sw');
  document.getElementById('appTitle').textContent=T[lang].appTitle;
  document.getElementById('searchInput').placeholder=T[lang].search;
  document.getElementById('emptyText').textContent=T[lang].noResults;
  renderFilters();renderCourses();
}
function renderFilters(){
  const depts=DEPTS[currentLang];
  document.getElementById('filterRow').innerHTML=DEPT_KEYS.map((k,i)=>
    `<button class="filter-chip${k===activeFilter?' active':''}" onclick="setFilter('${k}')">${depts[i]}</button>`
  ).join('');
}
function setFilter(k){activeFilter=k;renderFilters();renderCourses();}
function getFiltered(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  return COURSES.filter(c=>{
    const matchDept=activeFilter==='All'||c.dept===activeFilter;
    const matchQ=!q||c.name.en.toLowerCase().includes(q)||c.name.sw.toLowerCase().includes(q)||c.dept.toLowerCase().includes(q);
    return matchDept&&matchQ;
  });
}
function filterCourses(){renderCourses();}
function toggleCard(id){
  if(openCards[id]){delete openCards[id];}else{openCards[id]='modules';}
  renderCourses();
}
function setTab(id,tab,e){e.stopPropagation();openCards[id]=tab;renderCourses();}
function renderCourses(){
  const filtered=getFiltered();
  const list=document.getElementById('courseList');
  const empty=document.getElementById('emptyState');
  const lang=currentLang;
  const t=T[lang];
  const ordCount=filtered.filter(c=>c.type==='ordinary').length;
  const bachCount=filtered.filter(c=>c.type==='bachelor').length;
  document.getElementById('statsBar').innerHTML=
    `${t.showing} <span>${filtered.length}</span> ${t.of} ${COURSES.length} ${t.courses} &nbsp;·&nbsp; ${ordCount} Diploma · ${bachCount} Degree`;
  if(!filtered.length){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  list.innerHTML=filtered.map(c=>{
    const isOpen=!!openCards[c.id];
    const activeTab=openCards[c.id]||'modules';
    const isBach=c.type==='bachelor';
    const hasCS=!!c.comingSoon;
    const modulesContent=hasCS
      ?`<div class="coming-soon-box"><div style="font-size:20px">⏳</div><p>${t.comingSoon}<br><small>${t.comingSoonSub}</small></p></div>
         <div class="entry-section"><div class="entry-title">${t.entry}</div><div class="entry-text">${c.entry[lang]}</div></div>`
      :c.semesters.map(s=>`
        <div class="semester-block">
          <div class="semester-label">${s.label[lang]}</div>
          ${s.subjects.map((sub,i)=>`
            <div class="subject-row">
              <div class="subject-num">${i+1}</div>
              <div class="subject-dot"></div>
              <div class="subject-name">${sub.name}</div>
              ${sub.code&&sub.code!=='—'?`<div class="subject-code">${sub.code}</div>`:''}
            </div>`).join('')}
        </div>`).join('')+
        `<div class="entry-section"><div class="entry-title">${t.entry}</div><div class="entry-text">${c.entry[lang]}</div></div>`;
    const careerHTML=`<div class="careers-panel">
      <div class="career-section">
        <div class="career-title">💼 ${t.employed}</div>
        ${c.careers.employed.map(car=>`
          <div class="career-item">
            <div class="career-emoji">${car.emoji}</div>
            <div class="career-info">
              <div class="career-role">${car.role[lang]}</div>
              <div class="career-desc">${car.desc[lang]}</div>
              ${car.salary?`<span class="salary-badge">${car.salary}</span>`:''}
            </div>
          </div>`).join('')}
      </div>
      <div class="career-section">
        <div class="career-title">🚀 ${t.selfEmployed}</div>
        ${c.careers.self.map(car=>`
          <div class="career-item">
            <div class="career-emoji">${car.emoji}</div>
            <div class="career-info">
              <div class="career-role">${car.role[lang]}</div>
              <div class="career-desc">${car.desc[lang]}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
    return `
    <div class="course-card${isOpen?' open':''}">
      <div class="card-summary" onclick="toggleCard(${c.id})">
        <div class="dept-icon dept-${c.dept}">${c.icon}</div>
        <div class="card-text">
          <span class="dept-badge dept-${c.dept}">${c.dept}</span>${isBach?`<span class="level-badge">Bachelor</span>`:''}${hasCS?`<span class="level-badge" style="background:#FFF3E0;color:#E65100">⏳ Partial</span>`:''}
          <div class="course-name">${c.name[lang]}</div>
          <div class="course-meta"><span>📋 ${isBach?t.bachelor:t.ordinary}</span><span>⏱ ${c.duration[lang]}</span></div>
        </div>
        <div class="chevron-wrap"><div class="chevron"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      </div>
      <div class="card-tabs">
        <button class="tab-btn${activeTab==='modules'?' active':''}" onclick="setTab(${c.id},'modules',event)">📚 ${t.modules}</button>
        <button class="tab-btn${activeTab==='careers'?' active':''}" onclick="setTab(${c.id},'careers',event)">💼 ${t.careers}</button>
      </div>
      <div class="card-panel${activeTab==='modules'?' active':''}">${modulesContent}</div>
      <div class="card-panel${activeTab==='careers'?' active':''}">${careerHTML}</div>
    </div>`;
  }).join('');
}
renderFilters();renderCourses();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
